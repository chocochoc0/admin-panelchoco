<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #58a6ff; text-align: center; }
        label { display: block; margin-top: 12px; margin-bottom: 4px; font-size: 14px; color: #8b949e; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 14px; }
        input:focus { outline: none; border-color: #58a6ff; }
        button { width: 100%; margin-top: 20px; padding: 10px; background: #238636; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #2ea043; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; word-break: break-all; }
        .success { color: #3fb950; }
        .error { color: #f85149; }
    </style>
</head>
<body>

<div class="card">
    <h2>Админ-панель</h2>
    
    <label for="token">GitHub Token (PAT)</label>
    <input type="password" id="token" placeholder="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">

    <hr style="border: 0; border-top: 1px solid #30363d; margin: 20px 0;">

    <label for="username">Имя пользователя (Логин / Имя файла)</label>
    <input type="text" id="username" placeholder="alex">

    <label for="password">Пароль</label>
    <input type="text" id="password" placeholder="qwerty123">

    <label for="name">Отображаемое имя</label>
    <input type="text" id="name" placeholder="Алексей">

    <button onclick="createUser()">Создать пользователя</button>

    <div id="status"></div>
</div>

<script>
    const REPO_OWNER = "chocochoc0";
    const REPO_NAME = "admin-panelchoco";

    async function createUser() {
        const token = document.getElementById('token').value.trim();
        const username = document.getElementById('username').value.trim().toLowerCase();
        const password = document.getElementById('password').value.trim();
        const name = document.getElementById('name').value.trim();
        const status = document.getElementById('status');

        if (!token || !username || !password || !name) {
            status.className = "error";
            status.innerText = "Заполните все поля!";
            return;
        }

        status.className = "";
        status.innerText = "Создание файла на GitHub...";

        // Формируем содержимое JSON-файла
        const userData = {
            username: username,
            password: password,
            name: name
        };

        // Кодируем JSON в Base64 для передачи через GitHub API
        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(userData, null, 2))));

        // Путь: /users/username (без расширения)
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/users/${username}`;

        try {
            const response = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Create user: ${username}`,
                    content: contentBase64
                })
            });

            if (response.ok) {
                status.className = "success";
                status.innerText = `Успешно! Файл users/${username} создан.`;
                document.getElementById('username').value = "";
                document.getElementById('password').value = "";
                document.getElementById('name').value = "";
            } else {
                const errData = await response.json();
                status.className = "error";
                status.innerText = "Ошибка: " + (errData.message || "Не удалось создать пользователя");
            }
        } catch (e) {
            status.className = "error";
            status.innerText = "Ошибка сети!";
        }
    }
</script>

</body>
</html>
