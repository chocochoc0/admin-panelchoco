<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        button { width: 95%; padding: 10px; background: #007bff; border: none; color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card" id="loginBlock">
    <h2>Вход в Админку</h2>
    <input type="text" id="adminUser" placeholder="Имя пользователя">
    <input type="password" id="adminPass" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p id="error" style="color: red;"></p>
</div>

<div class="card hidden" id="adminBlock">
    <h2>Управление Юзерами</h2>
    <input type="text" id="newUsername" placeholder="Имя нового юзера">
    <button onclick="createUser()">Создать пользователя</button>
</div>

<script>
    // Жестко заданные данные (для базовой проверки)
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "123456"; 

    function login() {
        const u = document.getElementById('adminUser').value;
        const p = document.getElementById('adminPass').value;

        if (u === ADMIN_USER && p === ADMIN_PASS) {
            document.getElementById('loginBlock').classList.add('hidden');
            document.getElementById('adminBlock').classList.remove('hidden');
        } else {
            document.getElementById('error').innerText = "Неверный логин или пароль!";
        }
    }

    function createUser() {
        const username = document.getElementById('newUsername').value;
        if (!username) return alert("Введите имя!");
        
        alert("Чтобы добавить файл '" + username + "' без расширения в папку /users/, создай его в репозитории GitHub.");
    }
</script>

</body>
      </html>
